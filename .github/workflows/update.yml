name: Update selected proxies

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # Run every 24 hours (00:00 UTC)
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      count:
        description: "Number of proxies to select"
        required: false
        default: "100"
      no_check:
        description: "Skip TCP checks (diversity-only)?"
        required: false
        default: "false"

jobs:
  update:
    name: Fetch · Check · Select · Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit output/
      pages: write      # publish the clickable HTML page
      id-token: write   # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine parameters
        id: params
        run: |
          COUNT="${{ github.event.inputs.count || '100' }}"
          NO_CHECK_FLAG=""
          if [ "${{ github.event.inputs.no_check }}" = "true" ]; then
            NO_CHECK_FLAG="--no-check"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "no_check=$NO_CHECK_FLAG" >> "$GITHUB_OUTPUT"

      - name: Run selector
        run: |
          python select_proxies.py \
            --count ${{ steps.params.outputs.count }} \
            --out output/proxies.txt \
            --html output/proxies.html \
            --timeout 4 \
            --workers 200 \
            ${{ steps.params.outputs.no_check }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/proxies.txt output/proxies.html
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore: update proxies $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto latest origin/${GITHUB_REF_NAME} and retrying…"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((RANDOM % 6 + 2))
          done

          echo "Failed to push after retries." >&2
          exit 1

      # raw.githubusercontent.com serves files as plain text, so links there
      # are never clickable. GitHub Pages serves real HTML, where the
      # tg://proxy buttons open the Telegram app directly.
      # One-time setup: Settings → Pages → Source: "GitHub Actions".
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp output/proxies.html _site/index.html
          cp output/proxies.txt  _site/proxies.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
